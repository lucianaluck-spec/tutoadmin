<p-dialog header={{title}} styleClass="p-fluid" [breakpoints]="{'960px': '75vw', '640px': '100vw'}"
    [style]="{width: '50vw'}" [maximizable]="true" [modal]="true" [(visible)]="formVisible">

    <ng-template pTemplate="content">

        <form [formGroup]="form">

            <div class="p-field" *ngIf="editing">
                <label for="id">ID</label>
                <input type="text" formControlName="id" pInputText id="id" disabled="true" />
            </div>

            <div class="p-field">
                <label for="tema">Tema</label>
                <p-dropdown id="tema" formControlName="tema" [options]="temaOptions"
                    placeholder="Selecione" [showClear]="true" enterToTab>
                </p-dropdown>
            </div>
            <div class="p-field">
                <label for="explicacao">Explicação Geral</label><br />
                <textarea id="explicacao" type="text" formControlName="explicacao"
                 pInputTextarea enterToTab autofocus rows="5"
                    style="-webkit-box-sizing: border-box;
                -moz-box-sizing: border-box;
                box-sizing: border-box;
            
                width: 100%;"></textarea>

            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Salvar" icon="pi pi-check" (click)="saveOnClick()" class="p-button-sm">
        </button>

        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-sm p-button-secondary"
            (click)="cancelOnClick()">
        </button>
    </ng-template>
</p-dialog>
