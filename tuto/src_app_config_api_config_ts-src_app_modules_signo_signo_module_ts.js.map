<p-dialog header={{title}} styleClass="p-fluid" [breakpoints]="{'960px': '75vw', '640px': '100vw'}"
    [style]="{width: '50vw'}" [maximizable]="true" [modal]="true" [(visible)]="formVisible">

    <ng-template pTemplate="content">

        <form [formGroup]="form" >

            <div class="p-field" *ngIf="editing">
                <label for="id">ID</label>
                <input type="text" formControlName="id" pInputText id="id" disabled="true" />
            </div>

            <div class="p-field">
                <label for="nome">Nome</label>
                <input id="nome" type="text" formControlName="nome" pInputText id="nome" 
                    required autofocus
                    (keydown.enter)="focusNext($event)"
                    [ngStyle]="{'border-color': submitted && form.controls.nome.errors ? 'red' : ''}" />
                <small class="p-invalid" style="color: red" *ngIf="submitted && !form.controls.nome.value">campo
                    obrigatório</small>
            </div>
            <div class="p-field">
                <label for="diaPeriodo1">Dia Periodo Inicial</label>
                <p-dropdown id="diaPeriodo1" formControlName="diaPeriodo1" 
                   [options]="diaOptions"
                    placeholder="Selecione" [showClear]="true"
                    [filter]="true"
                    
                    >
                </p-dropdown>

            </div>
            <div class="p-field">
                <label for="mesPeriodo1">Mês Periodo Inicial</label>
                <p-dropdown id="mesPeriodo1" formControlName="mesPeriodo1" [options]="mesOptions"
                    placeholder="Selecione" [showClear]="true">
                </p-dropdown>

            </div>
            <div class="p-field">
                <label for="diaPeriodo2">Dia Periodo Final</label>
                <p-dropdown id="diaPeriodo2" formControlName="diaPeriodo2" [options]="diaOptions"
                    placeholder="Selecione" [showClear]="true">
                </p-dropdown>

            </div>
            <div class="p-field">
                <label for="mesPeriodo2">Mês Periodo Final</label>
                <p-dropdown id="mesPeriodo2" formControlName="mesPeriodo2" [options]="mesOptions"
                    placeholder="Selecione" [showClear]="true">
                </p-dropdown>

            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Salvar" icon="pi pi-check" (click)="saveOnClick()" class="p-button-sm">
        </button>

        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-sm p-button-secondary"
            (click)="cancelOnClick()">
        </button>
    </ng-template>
</p-dialog>
