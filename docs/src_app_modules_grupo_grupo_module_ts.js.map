<p-dialog header={{title}} styleClass="p-fluid" [breakpoints]="{'960px': '75vw', '640px': '100vw'}"
    [style]="{width: '50vw'}" [maximizable]="true" [modal]="true" [(visible)]="formVisible">

    <ng-template pTemplate="content">
        <p-tabView>
            <p-tabPanel header="Dados Gerais">
                <form [formGroup]="form">

                    <div class="p-field" *ngIf="editing">
                        <label for="id">ID</label>
                        <input type="text" formControlName="id" pInputText id="id" disabled="true" />
                    </div>

                    <div class="p-field">
                        <label for="descricao">Descrição</label>
                        <input id="nome" type="text" formControlName="descricao" pInputText id="descricao" required
                            autofocus
                            [ngStyle]="{'border-color': submitted && form.controls.descricao.errors ? 'red' : ''}" />
                        <small class="p-invalid" style="color: red"
                            *ngIf="submitted && !form.controls.descricao.value">campo
                            obrigatório</small>
                    </div>
                    <div class="p-field">
                        <label for="geracao">Geração:</label>
                        <input type="text" formControlName="geracao" pInputText id="geracao" required autofocus
                            [ngStyle]="{'border-color': submitted && form.controls.geracao.errors ? 'red' : ''}" />
                        <small class="p-invalid" style="color: red"
                            *ngIf="submitted && !form.controls.geracao.value">campo
                            obrigatório</small>
                    </div>

                    <div class="row">
                        <div class="col-3">
                            <button pButton pRipple label="Salvar" icon="pi pi-check" (click)="saveOnClick()" class="p-button-sm">
                            </button>
                    
                        </div>
                        <div class="col-3">
                        
                        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-sm p-button-secondary"
                            (click)="cancelOnClick()">
                        </button>
                        </div>
                    </div>
                </form>
                
            </p-tabPanel>

            <p-tabPanel header="Imagens" *ngIf="editing == true">
                <p-carousel [value]="images" [numVisible]="1" 
                [numScroll]="1" orientation="horizontal"
                    verticalViewPortHeight="100%">
                    <ng-template let-image pTemplate="item">
                        <div class="border-1 surface-border border-round m-2 p-3">
                            <div class="mb-3">
                                <div class="relative mx-auto">
                                    <p-image [src]="image.previewImageSrc" alt="Image" width="250"
                                     >
                                        
                                    </p-image>


                                </div>
                            </div>
                            <div class="mb-3 font-medium">
                                <button pButton pRipple label="Excluir" icon="pi pi-times" class="p-button-sm p-button-secondary"
                                (click)="excluiImagem(image.origem)">
                            </button>            
                            </div>
                        </div>
                    </ng-template>
                </p-carousel>

                <p-fileUpload name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php"
                    (onUpload)="onUpload($event)" [multiple]="true" chooseLabel="Escolha" uploadLabel="Enviar"
                    cancelLabel="Cancelar" accept="image/*" maxFileSize="2000000">
                    <ng-template pTemplate="content">
                        <ul *ngIf="uploadedFiles.length">
                            <li *ngFor="let file of uploadedFiles">
                                {{ file.name }} - {{ file.size }} bytes
                            </li>
                        </ul>
                    </ng-template>
                </p-fileUpload>

            </p-tabPanel>
        </p-tabView>
    </ng-template>

</p-dialog>
