<p-dialog header={{title}} styleClass="p-fluid" [breakpoints]="{'960px': '75vw', '640px': '100vw'}"
    [style]="{width: '50vw'}" [maximizable]="true" [modal]="true" [(visible)]="formVisible">

    <ng-template pTemplate="content">

        <form [formGroup]="form">
            <div class="row">
                <div class="col-4">
                    <div class="p-field" *ngIf="editing">
                        <label for="id">ID</label>
                        <input type="text" formControlName="id" pInputText id="id" disabled="true" />
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-field" *ngIf="editing">
                        <label for="id">Nro Cadastro</label>
                        <input type="text" formControlName="nroCadastro" pInputText id="nroCadastro" disabled="true" />
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-field" *ngIf="editing">
                        <label for="id">Sequencia</label>
                        <input type="text" formControlName="sequencia" pInputText id="sequencia" disabled="true" />
                    </div>
                </div>
            </div>

            <div class="card flex justify-content-center">
                <div class="row">
                  <div class="col-2" style="text-align: center;">
                    <img [src]="imgRecourse" width="80px" />
                  </div>
                  <div class="col-10">
                    <p-fileUpload name="demo" 
                    url="https://www.primefaces.org/cdn/api/upload.php" 
                    chooseLabel="Escolha" uploadLabel="Enviar"
                    cancelLabel="Cancelar"
                    (onUpload)="onUpload($event)" 
                    [multiple]="false" accept="image/*"
                      maxFileSize="1100000">
                      <ng-template pTemplate="content">
                        <ul *ngIf="uploadedFiles.length">
                          <li *ngFor="let file of uploadedFiles">
                            {{ file.name }} - {{ file.size }} bytes
                          </li>
                        </ul>
                      </ng-template>
                    </p-fileUpload>
                  </div>
                </div>
            </div>
            <div class="p-field">
                <label for="nomeAtual">Nome Atual</label>
                <input id="nomeAtual" type="text" formControlName="nomeAtual" pInputText id="nomeAtual" required
                class="to-upper-case" autofocus [ngStyle]="{'border-color': submitted && form.controls.nomeAtual.errors ? 'red' : ''}" />
                <small class="p-invalid" style="color: red" *ngIf="submitted && !form.controls.nomeAtual.value">campo
                    obrigatório</small>
            </div>
            <div class="p-field">
                <label for="nomeAtual">Nome Solteiro</label>
                <input id="nomeSolteiro" type="text" formControlName="nomeSolteiro" pInputText id="nomeSolteiro"
                class="to-upper-case" autofocus />

            </div>
            <div class="p-field">
                <label for="idGrupo">Grupo</label>
                <p-dropdown id="idGrupo" formControlName="idGrupo" optionValue="id" optionLabel="descricao"
                    [options]="grupos" placeholder="Selecione" [showClear]="true"
                   (click)="buscaAncestrais()" >
                </p-dropdown>
                
            </div>
            <div class="p-field">
                <label for="idAncestral">Ancestral</label>
                <p-dropdown id="idAncestral" formControlName="idAncestral"
                    optionValue="id" optionLabel="nomeAtual"
                    [options]="ancestrais" placeholder="Selecione" [showClear]="true"
                    >
                </p-dropdown>
                
            </div>
            <div class="p-field">
                <label for="dataNascimento">Data Nascimento</label>
                <input pInputText id="dataNascimento" formControlName="dataNascimento" type="date"
                   />
                
            </div>
            <div class="p-field">
                <label for="dataFalecimento">Data Falecimento</label>
                <input pInputText id="dataFalecimento" formControlName="dataFalecimento" type="date"
                     />
               
            </div>
            <div class="p-field">
                <label for="telefone">Telefone</label>
                <input pInputText id="telefone" formControlName="telefone" type="text" />

            </div>
            <div class="p-field">
                <label for="sexo">Sexo</label>
                <p-dropdown id="sexo" formControlName="sexo" [options]="sexoOptions" placeholder="Selecione"
                  [showClear]="true">
                </p-dropdown>
                
              </div>
            <div class="p-field">
                <label for="email">Email</label>
                <input pInputText email id="email" type="text" formControlName="email" />

            </div>

            <div class="p-field">
                <label for="regiaoAtual">Região Atual</label>
                <input id="regiaoAtual" type="text" formControlName="regiaoAtual" pInputText id="regiaoAtual"
                    autofocus />

            </div>
            <div class="p-field">
                <label for="regiaoOrigem">Região Origem</label>
                <input id="regiaoOrigem" type="text" formControlName="regiaoOrigem" pInputText id="regiaoOrigem"
                    autofocus />

            </div>
            <div class="p-field">
                <label for="gostoMusical">Gosto Musical</label>
                <input id="gostoMusical" type="text" formControlName="gostoMusical" pInputText id="gostoMusical"
                    autofocus />

            </div>
            <div class="p-field">
                <label for="religiao">Religião</label>
                <input id="religiao" type="text" formControlName="religiao" pInputText id="religiao" autofocus />

            </div>
            <div class="p-field">
                <label for="idProfissao">Profissão</label>
                <p-dropdown id="idProfissao" formControlName="idProfissao" optionValue="id" optionLabel="descricao"
                    [options]="profissoes" placeholder="Selecione" [showClear]="true"
                    >
                </p-dropdown>
                
            </div>
            <div class="p-field">
                <label for="conjugeAtual">Conjuge</label>
                <input id="conjugeAtual" type="text" formControlName="conjugeAtual" pInputText id="conjugeAtual"
                class="to-upper-case"  autofocus />

            </div>
            <div class="p-field">
                <label for="conjugeAnterior">Conjuge Anterior</label>
                <input id="conjugeAnterior" type="text" formControlName="conjugeAnterior" pInputText
                class="to-upper-case"  id="conjugeAnterior" autofocus />

            </div>
            <div class="p-field">
                <label for="urlLocalizacao">Url Localização</label>
                <input id="urlLocalizacao" type="text" formControlName="urlLocalizacao" pInputText
                    id="urlLocalizacao" autofocus />

            </div>
            <div class="row">
                <div class="col-6">
                    <div class="field-checkbox">
                        <p-checkbox formControlName="aceito" [binary]="true" inputId="binary"  >
                        </p-checkbox>
                      </div>
                      <label>Aceito</label>
                </div>
                <div class="col-6">
                    <div class="field-checkbox">
                        <p-checkbox formControlName="cancelado" [binary]="true" inputId="binary" >
                        </p-checkbox>
                      </div>
                      <label>Cancelado</label>
                </div>
                </div>
            <div class="p-field">
                <label for="observacao">Observação</label><br />
                <textarea id="observacao" type="text" formControlName="observacao" pInputTextarea
                    id="observacao" autofocus rows="5" cols="80" ></textarea>

            </div>

        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Salvar" icon="pi pi-check" (click)="saveOnClick()" class="p-button-sm">
        </button>

        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-sm p-button-secondary"
            (click)="cancelOnClick()">
        </button>
    </ng-template>
</p-dialog>
